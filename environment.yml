# Exact rebuild of the working env (osx-arm64, conda-forge-free 'defaults' channel).
# conda env create -f environment.yml   (run from the repo root)
# Exported with --no-builds; llvm-openmp is LightGBM's OpenMP runtime on macOS.
name: linkpred
channels:
  - defaults
dependencies:
  - bzip2=1.0.8
  - ca-certificates=2026.9.25
  - libcxx=22.1.2
  - libexpat=2.9.0
  - libffi=3.4.8
  - libzlib=1.3.2
  - llvm-openmp=22.1.2
  - ncurses=6.6
  - openssl=3.5.9
  - packaging=26.3
  - pip=26.2.1
  - python=3.11.17
  - readline=8.3
  - setuptools=84.0.0
  - sqlite=3.53.4
  - tk=8.6.15
  - wheel=0.47.0
  - xz=5.8.4
  - zlib=1.3.2
  - pip:
      # torch-cluster (Node2Vec random walks) is only on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cpu.html
      - aiohappyeyeballs==2.7.1
      - aiohttp==3.14.5
      - aiosignal==1.4.0
      - attrs==26.1.0
      - certifi==2026.7.22
      - charset-normalizer==3.5.2
      - cloudpickle==3.1.2
      - contourpy==1.3.3
      - cycler==0.12.1
      - filelock==4.1.1
      - fonttools==4.66.1
      - frozenlist==1.8.0
      - fsspec==2026.9.0
      - idna==3.20
      - iniconfig==2.3.1
      - jinja2==3.1.6
      - joblib==1.6.0
      - kiwisolver==1.5.1
      - lightgbm==4.5.0
      - llvmlite==0.50.0
      - markupsafe==3.0.4
      - matplotlib==3.9.2
      - mpmath==1.3.0
      - multidict==7.1.0
      - networkx==3.3
      - numba==0.68.0
      - numpy==1.26.4
      - pandas==2.2.3
      - pillow==12.3.0
      - pluggy==1.6.0
      - propcache==0.5.4
      - psutil==7.2.2
      - pyparsing==3.3.3
      - pytest==8.3.3
      - python-dateutil==2.9.0.post0
