# Exact rebuild of the working env (osx-arm64, conda 'defaults' channel + pip).
# conda env create -f environment.yml   (run from the repo root)
# Exported with --no-builds; llvm-openmp is LightGBM's OpenMP runtime on macOS.
name: linkpred
channels:
  - defaults
dependencies:
  - bzip2=1.0.8
  - ca-certificates=2026.9.25
  - libcxx=22.1.2
  - libexpat=2.9.0
  - libffi=3.4.8
  - libzlib=1.3.2
  - llvm-openmp=22.1.2
  - ncurses=6.6
  - openssl=3.5.9
  - packaging=26.3
  - pip=26.2.1
  - python=3.11.17
  - readline=8.3
  - setuptools=84.0.0
  - sqlite=3.53.4
  - tk=8.6.15
  - wheel=0.47.0
  - xz=5.8.4
  - zlib=1.3.2
  - pip:
      # torch-cluster (Node2Vec random walks) is only on the PyG wheel index.
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cpu.html
      - aiohappyeyeballs==2.7.1
