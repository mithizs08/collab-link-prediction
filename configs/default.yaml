# Default experiment configuration.
# Values marked TODO are placeholders to be fixed (and logged in docs/decisions.md)
# once the data has been inspected. Do not change split years after looking at
# test-period results.

seed: 0                      # global seed for any non-learned randomness (sampling, shuffles)
seeds: [0, 1, 2, 3, 4]       # every learned model is run once per seed

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results
  figures: figures
  report: report
  splits: data/processed/splits

data:
  # Raw input: existing OpenAlex snapshot from the earlier UTS project (read-only).
  # Set snapshot_path: null to build from data/raw/openalex_pages instead
  # (populated by `python -m linkpred.data.fetch_openalex`).
  source: openalex
  snapshot_path: /Users/zareenshyma/Documents/uts-research-intelligence/data/raw/uts_works_2015_2025.json
  institution_id: I114017466 # University of Technology Sydney (ROR 03f0f6041), verified 2026-10-14
  start_year: 2015
  end_year: 2025
  max_authors_per_work: 25   # works with more authors are kept in works.parquet but produce
                             # no edges: hyper-authored papers create huge cliques that dominate
                             # the graph without reflecting real collaboration ties
  # Dropped entirely before dedup and edge building (counted in the cleaning log):
  # these types repeat or annotate other works rather than record a collaboration.
  # Editorials and letters are kept.
  exclude_types: [erratum, peer-review, paratext]

# Temporal split. For each period, the observed graph is built ONLY from works
# with year < *_cutoff; positives are author pairs that co-author for the FIRST
# time in [cutoff, window_end]. Pairs already linked before the cutoff are not
# positives (we predict *new* collaborations).
splits:
  # Decided 2026-10-14 (docs/decisions.md): one-year windows, latest data.
  train:
    cutoff: 2023             # graph = works 2015-2022
    window_end: 2023         # predict first co-authorships in 2023
  val:
    cutoff: 2024             # graph = works 2015-2023
    window_end: 2024
  test:
    cutoff: 2025             # graph = works 2015-2024
    window_end: 2025
  # Only predict between authors present in the observed graph at the cutoff
  # (cold-start authors have no history; handled separately if at all).
  require_both_nodes_seen: true
  # Positives AND negatives are UTS-UTS pairs only. A UTS author for a split has at
  # least one UTS-affiliated authorship in a work with year < cutoff (i.e. at or
  # before the last graph year) -- never in the label window. The input graph
  # (heuristics, features, message passing) still uses ALL authors and edges
  # with year < cutoff.
  target_population: uts_uts
  # Cold-start diagnostic only (not a filter): fewer than 3 works before the cutoff.
  cold_start_max_works: 2

negatives:
  # Negatives per positive, per type, saved separately for every split. Both types are
  # UTS-UTS pairs of input-graph authors, unconnected before the cutoff and with no joint
  # work in the label window. Which mix to TRAIN on is decided in Phase 4 on validation.
  ratios:
    random: 1                # uniform unconnected UTS-UTS pairs
    hard_2hop: 1             # unconnected UTS-UTS pairs at distance exactly 2 in the full graph
  ranking_candidates: 100    # per positive (u, v): 100 corrupted tails (u, w) for Hits@K / MRR
  # Train split only: pools of 3 x positives per type, so 1:3 training mixes are possible.
  train_pool_ratio: 3

evaluation:
  # Protocols (docs/decisions.md, 2026-10-14): hard is the headline; diagnostic_all_vs_hard
  # is appendix-only. Bootstrap resamples are seeded from `seed`.
  protocols: [hard, rank_random, rank_hard, random, diagnostic_all_vs_hard]
  headline: {protocol: hard, metric: roc_auc}
  n_bootstrap: 1000
  rank_ks_random: [20, 50, 100]
  rank_ks_hard: [10, 20, 50]     # Hits@100 dropped: near-trivial with <= 101 items

features:
  # Recency half-life (years) for recency-weighted CN / AA, chosen on validation (hard ROC-AUC).
  half_life_grid: [0.5, 1, 2, 3, 5, 10]
  distance_cap: 5

models:
  heuristics:
    methods: [common_neighbors, jaccard, adamic_adar, resource_allocation, preferential_attachment]
    katz:
      max_path_length: 3     # walks of length 1..3
      # Chosen on validation under the headline protocol (hard, ROC-AUC) only.
      betas: [0.0001, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5]

  # Training negatives for the feature models: chosen on validation (Phase 4).
  training_mix:
    hard_fractions: [0.0, 0.5, 1.0]   # share of negatives that are hard (rest random)
    ratios: [1, 3]                    # negatives per positive

  logreg:
    C: 1.0                            # standardised features, log1p on heavy-tailed counts

  lightgbm:
    # Defaults (used for the negative-mix grid). Up to 2000 rounds with early stopping on
    # validation average precision under the hard protocol; never test.
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
    search:                           # 24 configs on the chosen mix, by validation hard ROC-AUC
      # Widened once (3 leaves, 300 min_child) after a dry run chose the corner (7, 100) of the
      # original 12-config grid; decided on validation only, before any test run.
      num_leaves: [3, 7, 15, 31]
      learning_rate: [0.03, 0.1]
      min_child_samples: [20, 100, 300]

  node2vec:
    embedding_dim: 128
    walk_length: 20
    context_size: 10
    walks_per_node: 10
    num_negative_samples: 1
    # One SGD pass over 10 walks per node, as in the original node2vec protocol (r = 10). Chosen
    # for compute: ~100 s per epoch on the 75k-100k-node graphs on this laptop's CPU.
    epochs: 1
    # 0.01 under-trains in one epoch (PyG initialises embeddings N(0,1)): edge-vs-random cosine AUC on
    # the TRAIN graph 0.868 at 0.01 vs 0.997 at 0.05 (unsupervised check, no labels; decisions.md).
    lr: 0.05
    batch_size: 256
    p_grid: [0.5, 1, 2]      # chosen on validation hard_active ROC-AUC
    q_grid: [0.5, 1, 2]
    operators: [hadamard, average, l1, l2]

  gnn:
    # Phase 6 (docs/decisions.md). Full-batch training on each split's input graph.
    objectives: [general, pair_focused]
    node_features: [structural, text]      # structural (4) | structural + 384-d author text vector
    general_mix: [0.0, 3]                  # Phase 4 rule's choice for LightGBM: random negatives, 1:3
    pair_focused_ratio: 3                  # activity-matched 2023 negatives, 1:3 (as pair-focused LightGBM)
    max_epochs: 300
    patience: 30                           # epochs without validation improvement
    weight_decay: 0.0005
    heads: 4                               # GAT
    oof_folds: 5                           # out-of-fold GNN scores for the hybrid's training pairs
    grid:                                  # chosen on validation only; 10 configs per objective x features
      sage: {hidden: [64, 128], layers: [2, 3], dropout: [0.3], lr: [0.001, 0.005]}
      gat: {hidden: [64, 128], layers: [2], dropout: [0.3], lr: [0.001, 0.005]}
